<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>PixelGame</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
:root{--bg:#1a1a1e;--panel:#25252b;--panel2:#2e2e36;--text:#e8e8ec;--muted:#9a9aa8;--accent:#5b8def;--green:#3dd68c;--border:#3a3a44}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
#sidebar{position:fixed;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:50}
.side-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;transition:background .15s;min-width:44px}
.side-btn:hover{background:var(--panel2)}
.side-btn span{font-size:13px}
@media(max-width:700px){.side-btn span{display:none}}
#inventory-bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:40;color:var(--muted);font-size:13px}
#inventory-box{background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:6px 18px;font-size:20px;font-weight:700;color:var(--text);letter-spacing:1px;min-width:110px;text-align:center}
#main{position:absolute;inset:0;overflow:hidden;cursor:crosshair}
#game-canvas{position:absolute;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges}
#coords{position:fixed;bottom:70px;left:16px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:6px;font-size:12px;font-family:monospace;z-index:30}
#online-count{position:fixed;bottom:70px;left:140px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:4px;z-index:30}
#tools{position:fixed;right:12px;bottom:80px;display:flex;flex-direction:column;gap:8px;z-index:40;align-items:center}
.tool-btn{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tool-btn:hover{background:var(--panel2)}
.tool-btn.active{border-color:var(--accent);color:var(--accent)}
.tool-label{font-size:11px;color:var(--muted);background:var(--panel);padding:2px 6px;border-radius:4px}
#palette{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:6px 10px;background:var(--panel);border-radius:10px;border:1px solid var(--border);z-index:40;max-width:95vw;overflow-x:auto}
.palette-color{width:26px;height:26px;border-radius:4px;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.palette-color:hover{transform:scale(1.15)}
.palette-color.selected{border-color:#fff;box-shadow:0 0 0 1px #000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal.hidden{display:none}
.modal-content{background:var(--panel);border-radius:14px;border:1px solid var(--border);padding:20px;max-width:420px;width:92%;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h2{font-size:18px}
.close-btn{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
.settings-section{margin-bottom:18px}
.settings-section h3{font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.switch-row,.select-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;cursor:pointer}
.switch-row input{display:none}
.switch{width:44px;height:24px;background:#444;border-radius:12px;position:relative;transition:.2s}
.switch::after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.switch-row input:checked+.switch{background:var(--green)}
.switch-row input:checked+.switch::after{left:23px}
.brush-choices{display:flex;gap:8px}
.brush-choice{flex:1;padding:12px;background:var(--panel2);border:2px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-size:13px}
.brush-choice.active{border-color:var(--accent);background:#2a3550}
select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px}
.earn-content{text-align:center}
#earn-animal-preview{height:130px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;background:var(--panel2);border-radius:10px}
#earn-animal-preview svg{max-height:110px}
.earn-title{margin-bottom:12px;color:var(--muted)}
.earn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.earn-opt{padding:10px 6px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:13px}
.earn-opt:hover{border-color:var(--accent)}
.earn-opt.correct{border-color:var(--green);background:#1a3a2a}
.earn-opt.wrong{border-color:#e55;background:#3a1a1a}
#earn-result{margin-top:12px;font-weight:600}
#profile-guest input{width:100%;padding:10px;margin-bottom:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text)}
.profile-header{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--panel2);border:2px solid var(--border)}
#profile-nick,#lookup-nick{font-size:18px;font-weight:600}
#profile-at,#lookup-at{color:var(--muted);font-size:13px}
.medals{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:10px;background:var(--panel2);border-radius:10px}
.medal{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
.medal .icon{font-size:22px}
.mod-section{margin-bottom:14px}
.mod-section input{width:100%;padding:8px;margin:6px 0;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)}
.chat-tabs{display:flex;gap:4px;margin-bottom:10px}
.chat-tab{flex:1;padding:6px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-size:12px}
.chat-tab.active{color:var(--text);border-color:var(--accent)}
#chat-messages{height:260px;overflow-y:auto;background:var(--panel2);border-radius:8px;padding:8px;margin-bottom:10px;font-size:13px}
.chat-msg{margin-bottom:6px}
.chat-msg .u{color:var(--accent);font-weight:600;margin-right:6px}
.chat-input-row{display:flex;gap:6px}
#chat-input{flex:1;padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)}
.btn{width:100%;padding:10px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;margin-top:6px}
.btn.secondary{background:var(--panel2);border:1px solid var(--border)}
.btn.small{width:auto;padding:8px 14px;margin:0}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);padding:10px 20px;border-radius:8px;z-index:200;font-size:14px}
#toast.hidden{display:none}
#clan-name-input{width:calc(100% - 90px);padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);margin-right:6px}
</style>
</head>
<body>

<aside id="sidebar">
  <button class="side-btn" id="btn-profile" title="Profile">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
    <span data-i18n="profile">Profile</span>
  </button>
  <button class="side-btn" id="btn-settings" title="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.2 7.2 0 00-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.57.23-1.11.54-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87a.48.48 0 00.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.86 14.5a.49.49 0 00-.12.61l1.92 3.32c.13.22.4.3.59.22l2.39-.96c.5.4 1.05.72 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.57-.22 1.11-.54 1.62-.94l2.39.96c.22.08.46 0 .59-.22l1.92-3.32a.48.48 0 00-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
    <span data-i18n="settings">Settings</span>
  </button>
  <button class="side-btn" id="btn-download" title="Download">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    <span data-i18n="download">Download</span>
  </button>
  <button class="side-btn" id="btn-templates" title="Templates">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
    <span data-i18n="templates">Templates</span>
  </button>
  <button class="side-btn" id="btn-clans" title="Clans">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    <span data-i18n="clans">Clans</span>
  </button>
</aside>

<div id="inventory-bar">
  <span data-i18n="inventory">Inventory</span>
  <div id="inventory-box"><span id="pixels-count">0</span>/<span id="pixels-max">60</span></div>
</div>

<main id="main">
  <canvas id="game-canvas"></canvas>
  <div id="coords">0000 × 0000</div>
  <div id="online-count">
    <span id="online-num">0</span>
    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span data-i18n="online">online</span>
  </div>
</main>

<div id="tools">
  <button class="tool-btn" id="btn-brush" title="Brush">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 00-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 000-1.41z"/></svg>
  </button>
  <div class="tool-label" id="brush-size-label">1×1</div>
  <button class="tool-btn" id="btn-lookup" title="Lookup">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </button>
  <button class="tool-btn" id="btn-earn" title="Earn">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.02 1.83-1.39 2.83-3.12 3.16z"/></svg>
  </button>
  <button class="tool-btn" id="btn-chat" title="Chat">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
  </button>
</div>

<div id="palette"></div>

<!-- EARN -->
<div id="modal-earn" class="modal hidden">
  <div class="modal-content earn-content">
    <div id="earn-animal-preview"></div>
    <p class="earn-title" data-i18n="choose_animal">Choose the correct animal</p>
    <div id="earn-options" class="earn-grid"></div>
    <p id="earn-result" class="hidden"></p>
    <button id="earn-close" class="btn secondary hidden" data-i18n="close">Close</button>
  </div>
</div>

<!-- SETTINGS -->
<div id="modal-settings" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header"><h2 data-i18n="settings">Settings</h2><button class="close-btn" data-close="modal-settings">×</button></div>
    <div class="settings-section">
      <h3>USER INTERFACE</h3>
      <label class="switch-row"><span>Canvas Grid (G)</span><input type="checkbox" id="set-grid" checked/><span class="switch"></span></label>
      <label class="switch-row"><span>Show Pixel Notifications (X)</span><input type="checkbox" id="set-notify" checked/><span class="switch"></span></label>
      <label class="switch-row"><span>History Mode (H)</span><input type="checkbox" id="set-history"/><span class="switch"></span></label>
      <label class="select-row"><span>Pencil Mode</span>
        <select id="set-pencil"><option value="normal">Normal</option><option value="template">From Template</option></select>
      </label>
    </div>
    <div class="settings-section">
      <h3>AUDIO</h3>
      <label class="switch-row"><span>Sound effects (M)</span><input type="checkbox" id="set-sound" checked/><span class="switch"></span></label>
    </div>
    <div class="settings-section">
      <h3>BRUSH SIZE (B)</h3>
      <div class="brush-choices">
        <button class="brush-choice active" data-size="1">1×1</button>
        <button class="brush-choice" data-size="3">3×3</button>
        <button class="brush-choice" data-size="5">5×5</button>
      </div>
    </div>
    <div class="settings-section">
      <h3>LANGUAGE</h3>
      <select id="set-lang"><option value="en">English</option><option value="ru">Русский</option><option value="tr">Türkçe</option></select>
    </div>
  </div>
</div>

<!-- PROFILE -->
<div id="modal-profile" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header"><h2 data-i18n="profile">Profile</h2><button class="close-btn" data-close="modal-profile">×</button></div>
    <div id="profile-guest">
      <input type="text" id="reg-username" placeholder="Nickname" maxlength="24"/>
      <input type="password" id="reg-password" placeholder="Password" maxlength="64"/>
      <button id="btn-register" class="btn">Register</button>
      <button id="btn-login" class="btn secondary">Login</button>
    </div>
    <div id="profile-user" class="hidden">
      <div class="profile-header">
        <div class="avatar"></div>
        <div><div id="profile-nick">Nick</div><div id="profile-at">@user</div></div>
      </div>
      <div class="medals" id="profile-medals"></div>
      <div class="mod-section">
        <label data-i18n="mod_code">Moderator code:</label>
        <input type="text" id="mod-code-input" placeholder="Enter code"/>
        <button id="btn-mod" class="btn small">Become mod</button>
      </div>
      <button id="btn-logout" class="btn secondary">Logout</button>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="modal-chat" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header"><h2 data-i18n="chat">Chat</h2><button class="close-btn" data-close="modal-chat">×</button></div>
    <div class="chat-tabs">
      <button class="chat-tab active" data-ch="global">Global</button>
      <button class="chat-tab" data-ch="ru">RU</button>
      <button class="chat-tab" data-ch="en">EN</button>
      <button class="chat-tab" data-ch="ar">AR</button>
      <button class="chat-tab" data-ch="tr">TR</button>
    </div>
    <div id="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" maxlength="200" placeholder="Message..."/>
      <button id="chat-send" class="btn small">Send</button>
    </div>
  </div>
</div>

<!-- CLANS -->
<div id="modal-clans" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header"><h2 data-i18n="clans">Clans</h2><button class="close-btn" data-close="modal-clans">×</button></div>
    <div id="clan-create-row" style="display:flex;margin-bottom:10px">
      <input type="text" id="clan-name-input" placeholder="Clan name" maxlength="24"/>
      <button id="btn-clan-create" class="btn small">Create</button>
    </div>
    <div id="clans-list" style="max-height:300px;overflow-y:auto"></div>
  </div>
</div>

<!-- LOOKUP -->
<div id="modal-lookup" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header"><h2>Pixel info</h2><button class="close-btn" data-close="modal-lookup">×</button></div>
    <div id="lookup-empty" class="hidden" style="color:var(--muted);text-align:center;padding:20px">Empty pixel</div>
    <div id="lookup-user">
      <div class="profile-header">
        <div class="avatar"></div>
        <div><div id="lookup-nick">—</div><div id="lookup-at">@—</div></div>
      </div>
      <div class="medals" id="lookup-medals"></div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Placed: <span id="lookup-coords"></span></p>
      <div id="lookup-mod-actions" class="hidden">
        <h3 style="font-size:12px;color:var(--muted);margin-bottom:8px">MOD ACTIONS</h3>
        <button class="btn small" id="mod-ban" style="background:#c44;margin-bottom:6px;width:100%">Ban (tap → −30)</button>
        <button class="btn small secondary" id="mod-unban" style="margin-bottom:6px;width:100%">Unban</button>
        <button class="btn small" id="mod-delete" style="background:#822;margin-bottom:6px;width:100%">Delete account</button>
        <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
          <input type="number" id="mod-mute-min" value="30" min="1" max="2880" style="width:70px;padding:6px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)"/>
          <button class="btn small secondary" id="mod-mute">Mute (min)</button>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" id="mod-placeban-min" value="60" min="1" max="2880" style="width:70px;padding:6px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)"/>
          <button class="btn small secondary" id="mod-placeban">No place (min)</button>
        </div>
        <p style="font-size:11px;color:var(--muted);margin-top:8px">1 min – 2880 min (2 days)</p>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
/* ===== I18N ===== */
const I18N={en:{profile:"Profile",settings:"Settings",download:"Download",templates:"Templates",clans:"Clans",inventory:"Inventory",online:"online",chat:"Chat",choose_animal:"Choose the correct animal",close:"Close",mod_code:"Moderator code:"},ru:{profile:"Профиль",settings:"Настройки",download:"Скачать",templates:"Шаблоны",clans:"Кланы",inventory:"Инвентарь",online:"в игре",chat:"Чат",choose_animal:"Выберите правильное животное",close:"Закрыть",mod_code:"Код модератора:"},tr:{profile:"Profil",settings:"Ayarlar",download:"İndir",templates:"Şablonlar",clans:"Klanlar",inventory:"Envanter",online:"çevrimiçi",chat:"Sohbet",choose_animal:"Doğru hayvanı seçin",close:"Kapat",mod_code:"Moderatör kodu:"}};
let currentLang=localStorage.getItem("lang")||"en";
function t(k){return(I18N[currentLang]&&I18N[currentLang][k])||I18N.en[k]||k}
function applyI18n(){document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)})}
function setLang(l){currentLang=l;localStorage.setItem("lang",l);applyI18n()}

/* ===== HELPERS ===== */
function showModal(id){document.getElementById(id).classList.remove("hidden")}
function hideModal(id){document.getElementById(id).classList.add("hidden")}
function toast(msg,ms=2500){const el=document.getElementById("toast");el.textContent=msg;el.classList.remove("hidden");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.add("hidden"),ms)}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function updateInventory(c,m){document.getElementById("pixels-count").textContent=c;document.getElementById("pixels-max").textContent=m}
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>hideModal(b.dataset.close)));

/* ===== STATE ===== */
window.authToken=localStorage.getItem("token")||null;
window.userPixels=parseInt(localStorage.getItem("guest_pixels")||"0",10);
window.userMaxPixels=60;
window.isMod=false;
window.lookupMode=false;
window.lookupTarget=null;
let earnCooldownUntil=0;
let currentChannel="global";
const CANVAS_W=4096,CANVAS_H=4096,CHUNK=256;

/* ===== CANVAS ENGINE ===== */
class PixelCanvas{
  constructor(el){
    this.canvas=el;this.ctx=el.getContext("2d",{alpha:false});
    this.viewX=2048;this.viewY=2048;this.zoom=4;
    this.palette=[];this.selectedColor=5;this.brushSize=1;this.showGrid=true;
    this.dragging=false;this.lastMouse={x:0,y:0};
    this.chunks=new Map();this.pixelData=new Map();this.ws=null;this.onPixelPlaced=null;this.mapImg=null;
    this._resize();window.addEventListener("resize",()=>this._resize());this._bind();
  }
  loadMap(){
    const img=new Image();img.crossOrigin="anonymous";
    img.onload=()=>{this.mapImg=img;this.render()};
    img.src="/world_map.png";
  }
  setPalette(a){this.palette=a}
  _resize(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight;this.render()}
  _bind(){
    const c=this.canvas;
    c.addEventListener("mousedown",e=>{
      if(e.button===0){this.dragging=false;this.lastMouse={x:e.clientX,y:e.clientY};this._place(e.clientX,e.clientY)}
      else{this.dragging=true;this.lastMouse={x:e.clientX,y:e.clientY}}
    });
    c.addEventListener("mousemove",e=>{
      if(this.dragging||e.buttons===4||e.buttons===2){
        this.viewX-=(e.clientX-this.lastMouse.x)/this.zoom;this.viewY-=(e.clientY-this.lastMouse.y)/this.zoom;
        this.lastMouse={x:e.clientX,y:e.clientY};this.render();this._coords();
      }else this._coords(e.clientX,e.clientY);
    });
    c.addEventListener("mouseup",()=>{this.dragging=false});
    c.addEventListener("contextmenu",e=>e.preventDefault());
    c.addEventListener("wheel",e=>{
      e.preventDefault();const oz=this.zoom;
      this.zoom=e.deltaY<0?Math.min(32,this.zoom*1.15):Math.max(0.25,this.zoom/1.15);
      const r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
      const wx=this.viewX+(mx-c.width/2)/oz,wy=this.viewY+(my-c.height/2)/oz;
      this.viewX=wx-(mx-c.width/2)/this.zoom;this.viewY=wy-(my-c.height/2)/this.zoom;
      this.render();this._loadChunks();
    },{passive:false});
    window.addEventListener("keydown",e=>{
      const s=40/this.zoom;
      if(e.key==="w"||e.key==="ArrowUp")this.viewY-=s;
      if(e.key==="s"||e.key==="ArrowDown")this.viewY+=s;
      if(e.key==="a"||e.key==="ArrowLeft")this.viewX-=s;
      if(e.key==="d"||e.key==="ArrowRight")this.viewX+=s;
      if(e.key==="q")this.zoom=Math.min(32,this.zoom*1.2);
      if(e.key==="e")this.zoom=Math.max(0.25,this.zoom/1.2);
      if(e.key==="g"){this.showGrid=!this.showGrid;document.getElementById("set-grid").checked=this.showGrid}
      this.render();this._coords();this._loadChunks();
    });
  }
  screenToWorld(sx,sy){return{x:Math.floor(this.viewX+(sx-this.canvas.width/2)/this.zoom),y:Math.floor(this.viewY+(sy-this.canvas.height/2)/this.zoom)}}
  _coords(sx,sy){
    let x,y;if(sx!==undefined){const w=this.screenToWorld(sx,sy);x=w.x;y=w.y}else{x=Math.floor(this.viewX);y=Math.floor(this.viewY)}
    x=Math.max(0,Math.min(CANVAS_W-1,x));y=Math.max(0,Math.min(CANVAS_H-1,y));
    document.getElementById("coords").textContent=String(x).padStart(4,"0")+" × "+String(y).padStart(4,"0");
  }
  async _place(sx,sy){
    const{x,y}=this.screenToWorld(sx,sy);
    if(x<0||y<0||x>=CANVAS_W||y>=CANVAS_H)return;
    if(window.lookupMode){lookupPixel(x,y);return}
    const half=Math.floor(this.brushSize/2);
    for(let dy=-half;dy<=half;dy++)for(let dx=-half;dx<=half;dx++){
      const px=x+dx,py=y+dy;
      if(px>=0&&py>=0&&px<CANVAS_W&&py<CANVAS_H&&this.onPixelPlaced)await this.onPixelPlaced(px,py,this.selectedColor);
    }
  }
  setPixelLocal(x,y,c){this.pixelData.set(x+","+y,c)}
  async _loadChunks(){
    const hw=(this.canvas.width/2)/this.zoom,hh=(this.canvas.height/2)/this.zoom;
    const x0=Math.max(0,Math.floor(this.viewX-hw)),y0=Math.max(0,Math.floor(this.viewY-hh));
    const x1=Math.min(CANVAS_W,Math.ceil(this.viewX+hw)),y1=Math.min(CANVAS_H,Math.ceil(this.viewY+hh));
    for(let cy=Math.floor(y0/CHUNK);cy<=Math.floor((y1-1)/CHUNK);cy++)
      for(let cx=Math.floor(x0/CHUNK);cx<=Math.floor((x1-1)/CHUNK);cx++){
        const key=cx+"_"+cy;
        if(!this.chunks.has(key)){this.chunks.set(key,"loading");
          try{const r=await fetch(`/api/chunk/${cx}/${cy}`);const d=await r.json();
            for(const[px,py,c]of d.pixels)this.pixelData.set(px+","+py,c);
            this.chunks.set(key,true);this.render();
          }catch(e){this.chunks.delete(key)}
        }
      }
  }
  render(){
    const ctx=this.ctx,w=this.canvas.width,h=this.canvas.height,z=this.zoom;
    ctx.fillStyle="#408cc8";ctx.fillRect(0,0,w,h);
    const sx0=this.viewX-w/2/z,sy0=this.viewY-h/2/z;
    // world map background
    if(this.mapImg){
      const dx=-sx0*z,dy=-sy0*z,dw=4096*z,dh=4096*z;
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(this.mapImg,dx,dy,dw,dh);
    }
    if(z>=1){
      for(const[key,ci]of this.pixelData){
        const[px,py]=key.split(",").map(Number);
        const sx=(px-sx0)*z,sy=(py-sy0)*z;
        if(sx+z<0||sy+z<0||sx>w||sy>h)continue;
        ctx.fillStyle=this.palette[ci]||"#000";
        ctx.fillRect(Math.floor(sx),Math.floor(sy),Math.ceil(z)+.5,Math.ceil(z)+.5);
      }
    }
    if(this.showGrid&&z>=6){
      ctx.strokeStyle="rgba(255,255,255,0.08)";ctx.lineWidth=1;ctx.beginPath();
      for(let x=Math.floor(sx0);x<sx0+w/z;x++){const s=(x-sx0)*z;ctx.moveTo(s,0);ctx.lineTo(s,h)}
      for(let y=Math.floor(sy0);y<sy0+h/z;y++){const s=(y-sy0)*z;ctx.moveTo(0,s);ctx.lineTo(w,s)}
      ctx.stroke();
    }
  }
  connectWS(url){
    this.ws=new WebSocket(url);
    this.ws.onmessage=ev=>{
      const msg=JSON.parse(ev.data);
      if(msg.type==="pixel"){this.setPixelLocal(msg.x,msg.y,msg.c);this.render()}
      if(msg.type==="online"){const el=document.getElementById("online-num");if(el)el.textContent=msg.count}
      if(msg.type==="chat")appendChat(msg);
    };
    this.ws.onclose=()=>setTimeout(()=>this.connectWS(url),2000);
  }
  init(){this.loadMap();this._loadChunks();this.render();this._coords()}
}

/* ===== PALETTE UI ===== */
function buildPalette(pal,onSelect){
  const c=document.getElementById("palette");c.innerHTML="";
  pal.forEach((hex,i)=>{if(i===0)return;
    const d=document.createElement("div");d.className="palette-color"+(i===5?" selected":"");
    d.style.background=hex;d.dataset.idx=i;
    d.onclick=()=>{c.querySelectorAll(".palette-color").forEach(x=>x.classList.remove("selected"));d.classList.add("selected");onSelect(i)};
    c.appendChild(d);
  });
}

/* ===== EARN ===== */
async function startEarn(){
  if(Date.now()<earnCooldownUntil){toast("Cooldown: "+((earnCooldownUntil-Date.now())/1000).toFixed(1)+"s");return}
  const res=await fetch("/api/earn/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:window.authToken})});
  if(!res.ok){toast("Error");return}
  const data=await res.json();
  document.getElementById("earn-animal-preview").innerHTML=data.svg||("<div style='font-size:64px'>"+(data.emoji||"?")+"</div>");
  const grid=document.getElementById("earn-options");grid.innerHTML="";
  document.getElementById("earn-result").classList.add("hidden");
  document.getElementById("earn-close").classList.add("hidden");
  data.options.forEach(name=>{
    const b=document.createElement("button");b.className="earn-opt";b.textContent=name;
    b.onclick=()=>submitEarn(data.challenge_id,name,b);grid.appendChild(b);
  });
  showModal("modal-earn");
}
async function submitEarn(cid,answer,btn){
  document.querySelectorAll(".earn-opt").forEach(b=>b.disabled=true);
  const res=await fetch("/api/earn/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({challenge_id:cid,answer,token:window.authToken})});
  const data=await res.json();
  if(data.correct){btn.classList.add("correct");document.getElementById("earn-result").textContent="+"+data.reward+" pixels!";document.getElementById("earn-result").style.color="#3dd68c";
    if(window.authToken)refreshMe();else{window.userPixels=Math.min(60,window.userPixels+data.reward);localStorage.setItem("guest_pixels",window.userPixels);updateInventory(window.userPixels,60)}
  }else{btn.classList.add("wrong");document.getElementById("earn-result").textContent="Wrong! It was "+data.correct_name;document.getElementById("earn-result").style.color="#e55"}
  document.getElementById("earn-result").classList.remove("hidden");
  document.getElementById("earn-close").classList.remove("hidden");
  earnCooldownUntil=Date.now()+data.cooldown*1000;
}

/* ===== LOOKUP ===== */
async function lookupPixel(x,y){
  const res=await fetch(`/api/pixel/${x}/${y}`);const data=await res.json();
  if(data.empty||!data.owner){
    document.getElementById("lookup-empty").classList.remove("hidden");
    document.getElementById("lookup-user").classList.add("hidden");
    document.getElementById("lookup-empty").textContent=data.empty?"Empty pixel":"Guest / unknown";
    showModal("modal-lookup");return;
  }
  document.getElementById("lookup-empty").classList.add("hidden");
  document.getElementById("lookup-user").classList.remove("hidden");
  const o=data.owner;window.lookupTarget=o.username_id;
  document.getElementById("lookup-nick").textContent=o.username;
  document.getElementById("lookup-at").textContent="@"+o.username_id;
  document.getElementById("lookup-coords").textContent=String(x).padStart(4,"0")+" × "+String(y).padStart(4,"0");
  const med=document.getElementById("lookup-medals");med.innerHTML="";
  if(o.medals.includes("discord"))med.innerHTML+='<div class="medal"><div class="icon">💬</div>+100 Discord</div>';
  if(o.medals.includes("mod"))med.innerHTML+='<div class="medal"><div class="icon">🛡️</div>+15 Mod</div>';
  if(o.medals.includes("clan"))med.innerHTML+='<div class="medal"><div class="icon">👥</div>'+escapeHtml(o.clan_name||"Clan")+'</div>';
  if(o.banned)med.innerHTML+='<div class="medal"><div class="icon">🚫</div>BANNED</div>';
  document.getElementById("lookup-mod-actions").classList.toggle("hidden",!window.isMod);
  showModal("modal-lookup");
}
async function modDo(action,minutes){
  if(!window.authToken||!window.lookupTarget)return;
  const res=await fetch("/api/mod/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:window.lookupTarget,token:window.authToken,action,minutes:minutes||0})});
  const data=await res.json();if(!res.ok)return toast(data.detail||"Error");toast(data.message||"OK");
}

/* ===== CLANS ===== */
async function loadClans(){
  const res=await fetch("/api/clans");const data=await res.json();
  const list=document.getElementById("clans-list");list.innerHTML="";
  if(!data.clans.length){list.innerHTML="<p style='color:var(--muted);text-align:center'>No clans yet</p>";return}
  data.clans.forEach(c=>{
    const div=document.createElement("div");
    div.style.cssText="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--panel2);border-radius:8px;margin-bottom:6px";
    div.innerHTML=`<div><strong>${escapeHtml(c.name)}</strong><div style="font-size:11px;color:var(--muted)">${c.member_count}/${c.max_members} · ${escapeHtml(c.leader)}</div></div>`;
    if(window.authToken){const b=document.createElement("button");b.className="btn small";b.textContent="Join";b.onclick=()=>joinClan(c.id);div.appendChild(b)}
    list.appendChild(div);
  });
}
async function createClan(){
  if(!window.authToken)return toast("Login first");
  const name=document.getElementById("clan-name-input").value.trim();if(!name)return;
  const res=await fetch("/api/clans/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,token:window.authToken})});
  const data=await res.json();if(!res.ok)return toast(data.detail||"Error");
  toast("Clan: "+data.name);document.getElementById("clan-name-input").value="";refreshMe();loadClans();
}
async function joinClan(id){
  const res=await fetch("/api/clans/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clan_id:id,token:window.authToken})});
  const data=await res.json();if(!res.ok)return toast(data.detail||"Error");toast("Joined!");refreshMe();loadClans();
}

/* ===== CHAT ===== */
async function loadChat(ch){
  currentChannel=ch;
  document.querySelectorAll(".chat-tab").forEach(t=>t.classList.toggle("active",t.dataset.ch===ch));
  const res=await fetch("/api/chat/"+ch);const data=await res.json();
  const box=document.getElementById("chat-messages");box.innerHTML="";
  data.messages.forEach(m=>{const d=document.createElement("div");d.className="chat-msg";d.innerHTML="<span class='u'>"+escapeHtml(m.user)+"</span>"+escapeHtml(m.text);box.appendChild(d)});
  box.scrollTop=box.scrollHeight;
}
function appendChat(msg){if(msg.channel!==currentChannel)return;const box=document.getElementById("chat-messages");const d=document.createElement("div");d.className="chat-msg";d.innerHTML="<span class='u'>"+escapeHtml(msg.user)+"</span>"+escapeHtml(msg.text);box.appendChild(d);box.scrollTop=box.scrollHeight}
async function sendChat(){
  const input=document.getElementById("chat-input");const text=input.value.trim();if(!text)return;
  await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({channel:currentChannel,text,token:window.authToken})});
  input.value="";
}

/* ===== AUTH ===== */
async function refreshMe(){
  try{
    const res=await fetch("/api/me",{headers:{Authorization:"Bearer "+window.authToken}});
    if(!res.ok){doLogout();return}
    const u=await res.json();
    window.userPixels=u.pixels;window.userMaxPixels=u.max_pixels;window.isMod=!!u.is_mod;
    updateInventory(u.pixels,u.max_pixels);showUserProfile(u);
  }catch(e){console.error(e)}
}
function showGuestProfile(){document.getElementById("profile-guest").classList.remove("hidden");document.getElementById("profile-user").classList.add("hidden");window.isMod=false}
function showUserProfile(u){
  document.getElementById("profile-guest").classList.add("hidden");document.getElementById("profile-user").classList.remove("hidden");
  document.getElementById("profile-nick").textContent=u.username;
  document.getElementById("profile-at").textContent="@"+u.username.toLowerCase();
  const m=document.getElementById("profile-medals");m.innerHTML="";
  if(u.medals.includes("discord"))m.innerHTML+='<div class="medal"><div class="icon">💬</div>+100 Discord</div>';
  if(u.medals.includes("mod"))m.innerHTML+='<div class="medal"><div class="icon">🛡️</div>+15 Mod</div>';
  if(u.medals.includes("clan"))m.innerHTML+='<div class="medal"><div class="icon">👥</div>Clan +5/member</div>';
}
async function doRegister(){
  const username=document.getElementById("reg-username").value.trim(),password=document.getElementById("reg-password").value;
  if(!username||!password)return toast("Fill fields");
  const res=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
  const data=await res.json();if(!res.ok)return toast(data.detail||"Error");
  window.authToken=data.token;localStorage.setItem("token",data.token);toast("Registered!");await refreshMe();
}
async function doLogin(){
  const username=document.getElementById("reg-username").value.trim(),password=document.getElementById("reg-password").value;
  const res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
  const data=await res.json();if(!res.ok)return toast(data.detail||"Error");
  window.authToken=data.token;localStorage.setItem("token",data.token);
  window.userPixels=data.pixels;window.userMaxPixels=data.max_pixels;updateInventory(data.pixels,data.max_pixels);
  toast("Welcome, "+data.username);await refreshMe();
}
function doLogout(){window.authToken=null;localStorage.removeItem("token");window.userMaxPixels=60;window.userPixels=parseInt(localStorage.getItem("guest_pixels")||"0",10);updateInventory(window.userPixels,60);showGuestProfile();toast("Logged out")}
async function doMod(){
  const code=document.getElementById("mod-code-input").value.trim();
  if(!window.authToken)return toast("Login first");
  const res=await fetch("/api/mod/activate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,token:window.authToken})});
  const data=await res.json();if(!res.ok)return toast(data.detail||"Wrong code");toast("You are moderator!");await refreshMe();
}

/* ===== INIT ===== */
let engine=null;
async function init(){
  applyI18n();
  engine=new PixelCanvas(document.getElementById("game-canvas"));
  const palRes=await fetch("/api/palette");const palData=await palRes.json();
  engine.setPalette(palData.palette);buildPalette(palData.palette,i=>engine.selectedColor=i);
  engine.onPixelPlaced=async(x,y,color)=>{
    if(window.userPixels<=0){toast("No pixels! Press Earn");return}
    try{
      const res=await fetch("/api/place",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({x,y,color,token:window.authToken})});
      const data=await res.json();
      if(!res.ok){toast(data.detail||"Cannot place");return}
      if(data.pixels_left!=null)window.userPixels=data.pixels_left;
      else{window.userPixels=Math.max(0,window.userPixels-1);localStorage.setItem("guest_pixels",window.userPixels)}
      updateInventory(window.userPixels,window.userMaxPixels);
      engine.setPixelLocal(x,y,color);engine.render();
    }catch(e){toast("Network error")}
  };
  const proto=location.protocol==="https:"?"wss:":"ws:";
  engine.connectWS(proto+"//"+location.host+"/ws");
  setInterval(()=>{if(engine.ws&&engine.ws.readyState===1)engine.ws.send(JSON.stringify({type:"ping"}))},25000);
  engine.init();
  if(window.authToken)await refreshMe();else{updateInventory(window.userPixels,60);showGuestProfile()}

  /* events */
  document.getElementById("btn-profile").onclick=()=>showModal("modal-profile");
  document.getElementById("btn-settings").onclick=()=>showModal("modal-settings");
  document.getElementById("btn-chat").onclick=()=>{showModal("modal-chat");loadChat(currentChannel)};
  document.getElementById("btn-clans").onclick=()=>{showModal("modal-clans");loadClans()};
  document.getElementById("btn-earn").onclick=startEarn;
  document.getElementById("earn-close").onclick=()=>hideModal("modal-earn");
  document.getElementById("btn-download").onclick=()=>{const a=document.createElement("a");a.download="pixel_"+Date.now()+".png";a.href=document.getElementById("game-canvas").toDataURL();a.click();toast("Saved")};
  document.getElementById("btn-lookup").onclick=()=>{
    window.lookupMode=!window.lookupMode;
    document.getElementById("btn-lookup").classList.toggle("active",window.lookupMode);
    document.getElementById("game-canvas").style.cursor=window.lookupMode?"help":"crosshair";
    toast(window.lookupMode?"Lookup ON – click pixel":"Lookup OFF");
  };
  document.getElementById("set-grid").onchange=e=>{engine.showGrid=e.target.checked;engine.render()};
  document.querySelectorAll(".brush-choice").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".brush-choice").forEach(x=>x.classList.remove("active"));b.classList.add("active");
    engine.brushSize=parseInt(b.dataset.size,10);document.getElementById("brush-size-label").textContent=b.dataset.size+"×"+b.dataset.size;
  });
  document.getElementById("set-lang").value=currentLang;
  document.getElementById("set-lang").onchange=e=>setLang(e.target.value);
  document.getElementById("btn-register").onclick=doRegister;
  document.getElementById("btn-login").onclick=doLogin;
  document.getElementById("btn-logout").onclick=doLogout;
  document.getElementById("btn-mod").onclick=doMod;
  document.getElementById("btn-clan-create").onclick=createClan;
  document.getElementById("mod-ban").onclick=()=>modDo("ban");
  document.getElementById("mod-unban").onclick=()=>modDo("unban");
  document.getElementById("mod-delete").onclick=()=>{if(confirm("Delete account?"))modDo("delete")};
  document.getElementById("mod-mute").onclick=()=>modDo("mute",parseInt(document.getElementById("mod-mute-min").value,10)||30);
  document.getElementById("mod-placeban").onclick=()=>modDo("place_ban",parseInt(document.getElementById("mod-placeban-min").value,10)||60);
  document.querySelectorAll(".chat-tab").forEach(t=>t.onclick=()=>loadChat(t.dataset.ch));
  document.getElementById("chat-send").onclick=sendChat;
  document.getElementById("chat-input").onkeydown=e=>{if(e.key==="Enter")sendChat()};
}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
