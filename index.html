<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PixPaint</title>
<style>
:root{--bg:#0b0e14;--panel:#151a23;--panel2:#1c2330;--border:#2a3344;--text:#e8eef7;--muted:#8b9bb4;--accent:#3b82f6;--green:#22c55e;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#app{height:100vh;width:100vw;position:relative}
#canvas-wrap{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#1e5f8a}
#bg-map,#pixel-canvas,#template-canvas{position:absolute;top:0;left:0;transform-origin:0 0;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(21,26,35,.92);border:1px solid var(--border);border-radius:999px;padding:6px 14px;display:flex;gap:12px;align-items:center;z-index:30;font-size:12px;backdrop-filter:blur(8px);max-width:94vw}
#coords{font-family:monospace;color:var(--muted)}
#pix-info{color:var(--green);font-weight:700}
#tools{position:absolute;right:8px;top:56px;display:flex;flex-direction:column;gap:6px;z-index:30}
.tool{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:700;font-size:13px;cursor:pointer}
.tool.active{border-color:var(--accent);background:var(--panel2)}
#menu-btn{position:absolute;left:8px;top:8px;z-index:30;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:18px;cursor:pointer}
#menu{position:absolute;left:8px;top:54px;z-index:30;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;min-width:150px}
#menu.show{display:flex}
#menu button{border:none;background:transparent;color:var(--text);text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px}
#menu button:hover{background:var(--panel2)}
#palette-bar{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:4px;width:min(96vw,420px)}
#palette-nav{display:flex;gap:8px;align-items:center}
#palette-nav button{width:30px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}
#palette{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:rgba(21,26,35,.95);border:1px solid var(--border);border-radius:12px;padding:7px}
.swatch{width:100%;aspect-ratio:1;border-radius:5px;border:2px solid transparent;cursor:pointer}
.swatch.selected{border-color:#fff}
#bottom{position:absolute;bottom:0;left:0;right:0;height:50px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 8px;z-index:30;overflow-x:auto}
.bot{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px;white-space:nowrap}
.bot.primary{background:var(--accent);border-color:var(--accent);font-weight:700}
#status{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
#lookup{position:absolute;z-index:50;display:none;min-width:200px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;width:min(400px,96vw);max-height:88vh;overflow-y:auto}
.modal h2{font-size:16px;margin-bottom:10px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.modal input,.modal select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b0e14;color:var(--text);font-size:14px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.modal button{padding:9px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:13px}
.modal button.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.modal button.danger{background:var(--danger)}
#earn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.earn-opt{padding:12px 6px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);text-align:center;cursor:pointer;font-size:13px;text-transform:capitalize}
#notify{position:fixed;top:14px;right:14px;background:var(--panel);border:1px solid var(--border);padding:10px 14px;border-radius:10px;z-index:200;display:none;max-width:260px;font-size:13px}
#notify.show{display:block}
.clan-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
<div id="canvas-wrap">
<img id="bg-map" src="world_map.png" draggable="false" style="width:4096px;height:4096px;object-fit:fill">
<canvas id="template-canvas" width="4096" height="4096"></canvas>
<canvas id="pixel-canvas" width="4096" height="4096"></canvas>
</div>
<button id="menu-btn">☰</button>
<div id="menu">
<button id="btn-profile">Profile</button>
<button id="btn-settings">Settings</button>
<button id="btn-template">Template</button>
<button id="btn-clans">Clans</button>
<button id="btn-download">Screenshot</button>
<button id="btn-clear-mod" style="display:none">Clear water (mod)</button>
</div>
<div id="hud"><span id="coords">0000 x 0000</span><span>Pixels: <span id="pix-info">60/60</span></span><span id="user-chip"></span></div>
<div id="tools">
<button class="tool active" id="tool-paint" title="Paint">✏️</button>
<button class="tool" id="tool-lookup" title="Lookup">🔍</button>
<button class="tool" id="brush-1">1</button>
<button class="tool" id="brush-3">3</button>
<button class="tool" id="brush-5">5</button>
</div>
<div id="palette-bar">
<div id="palette-nav"><button id="pal-prev">‹</button><span id="palette-page" style="color:var(--muted);font-size:12px">1/1</span><button id="pal-next">›</button></div>
<div id="palette"></div>
</div>
<div id="bottom">
<button class="bot primary" id="btn-earn">🐾 Earn</button>
<button class="bot" id="btn-auth">Login</button>
<span id="status">...</span>
</div>
<div id="lookup"></div>
</div>
<div id="notify"></div>

<div class="overlay" id="ov-auth"><div class="modal">
<h2 id="auth-title">Login</h2>
<label>Username</label><input id="auth-user" autocomplete="username">
<label>Password</label><input id="auth-pass" type="password" autocomplete="current-password">
<div id="auth-pass2-wrap" style="display:none"><label>Password again</label><input id="auth-pass2" type="password"></div>
<div class="row"><button id="auth-go">OK</button><button class="ghost" id="auth-switch">Register</button><button class="ghost" onclick="closeOv('ov-auth')">Close</button></div>
</div></div>

<div class="overlay" id="ov-profile"><div class="modal">
<h2>Profile</h2><div id="profile-body"></div>
<label>Mod code</label><input id="mod-code" placeholder="Enter mod code">
<div class="row"><button id="btn-mod">Become mod</button><button class="ghost" onclick="closeOv('ov-profile')">Close</button></div>
</div></div>

<div class="overlay" id="ov-settings"><div class="modal">
<h2>Settings</h2>
<label>Language</label>
<select id="lang"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="tr">Türkçe</option></select>
<div class="row"><button class="ghost" onclick="closeOv('ov-settings')">Close</button></div>
</div></div>

<div class="overlay" id="ov-earn"><div class="modal">
<h2>Earn pixels</h2>
<p style="color:var(--muted);font-size:13px">Choose the correct animal</p>
<div id="earn-grid"></div>
<p id="earn-msg" style="min-height:18px;font-size:13px"></p>
<button class="ghost" onclick="closeOv('ov-earn')">Close</button>
</div></div>

<div class="overlay" id="ov-clans"><div class="modal">
<h2>Clans</h2><div id="clans-body"></div>
<label>New clan name</label><input id="clan-name">
<div class="row"><button id="btn-clan-create">Create</button><button class="ghost" onclick="closeOv('ov-clans')">Close</button></div>
</div></div>

<div class="overlay" id="ov-template"><div class="modal">
<h2>Template</h2>
<input type="file" id="tpl-file" accept="image/*">
<label>X position</label><input id="tpl-x" type="number" value="0">
<label>Y position</label><input id="tpl-y" type="number" value="0">
<label>Max width (px, 0 = original)</label><input id="tpl-w" type="number" value="0">
<label>Opacity</label><input id="tpl-opacity" type="range" min="10" max="90" value="45">
<div class="row"><button id="btn-tpl-apply">Apply</button><button class="danger" id="btn-tpl-clear">Remove</button><button class="ghost" onclick="closeOv('ov-template')">Close</button></div>
</div></div>

<div class="overlay" id="ov-clear"><div class="modal">
<h2>Clear area (mod)</h2>
<label>X1</label><input id="cx1" type="number" value="0">
<label>Y1</label><input id="cy1" type="number" value="0">
<label>X2</label><input id="cx2" type="number" value="100">
<label>Y2</label><input id="cy2" type="number" value="100">
<label><input type="checkbox" id="cfull"> Full clear</label>
<div class="row"><button class="danger" id="btn-do-clear">Clear</button><button class="ghost" onclick="closeOv('ov-clear')">Cancel</button></div>
</div></div>

<script>
(function(){
const SIZE=4096;
// HEX palette matching backend style - 5 shades per hue
function hexShade(r,g,b,f){return "#"+[r,g,b].map(v=>{const n=Math.max(0,Math.min(255,Math.round(v*f)));return n.toString(16).padStart(2,"0");}).join("");}
const BASES=[
[220,38,38],[234,88,12],[245,158,11],[234,179,8],[132,204,22],[34,197,94],[20,184,166],[6,182,212],[59,130,246],[99,102,241],[168,85,247],[217,70,239],[236,72,153]
];
const FACTORS=[0.35,0.55,1.0,1.25,1.45];
const ALL=[];
BASES.forEach(function(b){FACTORS.forEach(function(f){ALL.push(hexShade(b[0],b[1],b[2],f));});});
["#000000","#333333","#666666","#999999","#cccccc","#ffffff"].forEach(function(c){ALL.push(c);});
const PAGE=30;const PAGES=[];
for(let i=0;i<ALL.length;i+=PAGE)PAGES.push(ALL.slice(i,i+PAGE));

let token=localStorage.getItem("pix_token");
let user=null,color=ALL[10],tool="paint",brush=1;
let scale=0.2,ox=0,oy=0,palPage=0,earnCD=0,placing=false;
let tplImg=null;

const wrap=document.getElementById("canvas-wrap");
const canvas=document.getElementById("pixel-canvas");
const ctx=canvas.getContext("2d",{alpha:true});
const bgMap=document.getElementById("bg-map");
const tplC=document.getElementById("template-canvas");
const tplCtx=tplC.getContext("2d");
ctx.clearRect(0,0,SIZE,SIZE);

function apply(){const t="translate("+ox+"px,"+oy+"px) scale("+scale+")";canvas.style.transform=t;bgMap.style.transform=t;tplC.style.transform=t;}
function centerView(){const w=wrap.clientWidth,h=wrap.clientHeight;scale=Math.min(w/SIZE,h/SIZE)*0.98;ox=(w-SIZE*scale)/2;oy=(h-SIZE*scale)/2;apply();}

function renderPal(){
  const el=document.getElementById("palette");el.innerHTML="";
  (PAGES[palPage]||[]).forEach(function(c){
    const d=document.createElement("div");d.className="swatch"+(c===color?" selected":"");d.style.background=c;
    d.onclick=function(){color=c;renderPal();};el.appendChild(d);
  });
  document.getElementById("palette-page").textContent=(palPage+1)+"/"+PAGES.length;
}
document.getElementById("pal-prev").onclick=function(){palPage=(palPage-1+PAGES.length)%PAGES.length;renderPal();};
document.getElementById("pal-next").onclick=function(){palPage=(palPage+1)%PAGES.length;renderPal();};
renderPal();

async function api(path,opts){
  opts=opts||{};const headers=Object.assign({},opts.headers||{});
  if(token)headers.Authorization="Bearer "+token;
  if(opts.json){headers["Content-Type"]="application/json";opts.body=JSON.stringify(opts.json);}
  const res=await fetch(path,Object.assign({},opts,{headers:headers}));
  let data={};try{data=await res.json();}catch(e){}
  if(!res.ok)throw new Error(typeof data.detail==="string"?data.detail:(data.msg||res.statusText||"Error"));
  return data;
}

async function loadMe(){
  try{
    const d=await api("/me");
    if(d.guest){user=null;document.getElementById("pix-info").textContent=d.pixels_left+"/"+d.limit;document.getElementById("user-chip").textContent="";document.getElementById("btn-clear-mod").style.display="none";}
    else{user=d;document.getElementById("pix-info").textContent=d.pixels_left+"/"+d.limit;document.getElementById("user-chip").textContent=" @"+d.username+(d.is_mod?" MOD":"");document.getElementById("btn-clear-mod").style.display=d.is_mod?"block":"none";}
    updAuth();
  }catch(e){document.getElementById("pix-info").textContent="60/60";}
}
function updAuth(){
  const b=document.getElementById("btn-auth");
  if(user){b.textContent="Logout";b.onclick=function(){token=null;localStorage.removeItem("pix_token");user=null;updAuth();loadMe();};}
  else{b.textContent="Login";b.onclick=function(){openAuth(false);};}
}

// WS
let ws;
function connectWS(){
  const p=location.protocol==="https:"?"wss":"ws";
  try{ws=new WebSocket(p+"://"+location.host+"/ws");}catch(e){document.getElementById("status").textContent="No WS";return;}
  ws.onopen=function(){document.getElementById("status").textContent="Online";document.getElementById("status").style.color="var(--green)";};
  ws.onclose=function(){document.getElementById("status").textContent="Reconnecting";setTimeout(connectWS,2000);};
  ws.onmessage=function(ev){try{const m=JSON.parse(ev.data);if(m.type==="pixel"){ctx.fillStyle=m.color;ctx.fillRect(m.x,m.y,1,1);}if(m.type==="clear")ctx.clearRect(m.x1,m.y1,m.x2-m.x1+1,m.y2-m.y1+1);if(m.type==="clear_all")ctx.clearRect(0,0,SIZE,SIZE);}catch(e){}};
}

// Zoom toward point
function zoomAt(cx,cy,factor){
  const ns=Math.min(40,Math.max(0.05,scale*factor));
  ox=cx-(cx-ox)*(ns/scale);oy=cy-(cy-oy)*(ns/scale);scale=ns;apply();
}
wrap.addEventListener("wheel",function(e){e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY>0?0.9:1.12);},{passive:false});

// Unified pointer: pan vs tap
let mode=null; // pan | maybe
let startX=0,startY=0,lastX=0,lastY=0,moved=false;
let pinch=null;

wrap.addEventListener("pointerdown",function(e){
  if(e.pointerType==="mouse"&&e.button===2){mode="pan";startX=lastX=e.clientX;startY=lastY=e.clientY;moved=false;wrap.setPointerCapture(e.pointerId);return;}
  if(e.pointerType==="mouse"&&e.button!==0)return;
  mode="maybe";startX=lastX=e.clientX;startY=lastY=e.clientY;moved=false;
  try{wrap.setPointerCapture(e.pointerId);}catch(err){}
});
wrap.addEventListener("pointermove",function(e){
  if(pinch)return;
  if(!mode)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  if(mode==="maybe"&&(Math.abs(e.clientX-startX)>8||Math.abs(e.clientY-startY)>8)){mode="pan";moved=true;}
  if(mode==="pan"){ox+=dx;oy+=dy;apply();moved=true;}
});
wrap.addEventListener("pointerup",function(e){
  if(mode==="maybe"&&!moved){// tap = paint or lookup
    handleTap(e.clientX,e.clientY);
  }
  mode=null;moved=false;
});
wrap.addEventListener("pointercancel",function(){mode=null;pinch=null;});
wrap.addEventListener("contextmenu",function(e){e.preventDefault();});

// Touch pinch
wrap.addEventListener("touchstart",function(e){
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const r=wrap.getBoundingClientRect();
    pinch={dist:Math.hypot(dx,dy),cx:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,cy:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top};
    mode=null;
  }
},{passive:true});
wrap.addEventListener("touchmove",function(e){
  if(pinch&&e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.hypot(dx,dy);
    const r=wrap.getBoundingClientRect();
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left;
    const cy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    zoomAt(cx,cy,dist/(pinch.dist||dist));
    pinch.dist=dist;pinch.cx=cx;pinch.cy=cy;
  }
},{passive:true});
wrap.addEventListener("touchend",function(e){if(e.touches.length<2)pinch=null;},{passive:true});

function screenToWorld(sx,sy){
  const r=wrap.getBoundingClientRect();
  return {x:Math.floor((sx-r.left-ox)/scale),y:Math.floor((sy-r.top-oy)/scale)};
}
function updateCoords(sx,sy){
  const p=screenToWorld(sx,sy);
  if(p.x>=0&&p.y>=0&&p.x<SIZE&&p.y<SIZE)document.getElementById("coords").textContent=String(p.x).padStart(4,"0")+" x "+String(p.y).padStart(4,"0");
}
window.addEventListener("pointermove",function(e){updateCoords(e.clientX,e.clientY);});

async function handleTap(sx,sy){
  const p=screenToWorld(sx,sy);
  if(p.x<0||p.y<0||p.x>=SIZE||p.y>=SIZE)return;
  if(tool==="lookup"){showLookup(p.x,p.y,sx,sy);return;}
  if(placing)return;placing=true;
  const half=Math.floor(brush/2);
  try{
    for(let dy=-half;dy<=half;dy++)for(let dx=-half;dx<=half;dx++){
      const px=p.x+dx,py=p.y+dy;if(px<0||py<0||px>=SIZE||py>=SIZE)continue;
      ctx.fillStyle=color;ctx.fillRect(px,py,1,1);
      try{await api("/place",{method:"POST",json:{x:px,y:py,color:color}});}catch(err){notify(String(err.message||err));}
    }
    loadMe();
  }finally{placing=false;}
}

async function showLookup(x,y,sx,sy){
  const pop=document.getElementById("lookup");
  pop.style.display="block";pop.style.left=Math.min(sx+8,innerWidth-220)+"px";pop.style.top=Math.min(sy+8,innerHeight-180)+"px";
  pop.innerHTML="...";
  try{
    const d=await api("/lookup?x="+x+"&y="+y);
    if(d.empty){pop.innerHTML="<b>Empty</b><br>"+x+" x "+y;return;}
    let h="<b>@"+d.username+"</b><br>"+x+" x "+y+"<br>"+(d.is_mod?"MOD ":"")+(d.discord_medal?"DISCORD":"");
    if(user&&user.is_mod)h+="<br><button onclick=\"modAct('ban','"+d.username+"')\">Ban</button> <button onclick=\"modAct('mute','"+d.username+"')\">Mute</button> <button onclick=\"modAct('no_place','"+d.username+"')\">No place</button>";
    pop.innerHTML=h;
  }catch(e){pop.innerHTML="No data<br>"+x+" x "+y;}
}
window.modAct=async function(a,t){try{await api("/mod/"+a,{method:"POST",json:{target:t,minutes:a==="no_place"?60:30}});notify("OK");document.getElementById("lookup").style.display="none";}catch(e){notify(e.message);}};
document.addEventListener("click",function(e){const p=document.getElementById("lookup");if(!p.contains(e.target)&&e.target.id!=="tool-lookup")p.style.display="none";});

document.getElementById("tool-paint").onclick=function(){tool="paint";document.querySelectorAll(".tool").forEach(function(t){t.classList.remove("active");});this.classList.add("active");};
document.getElementById("tool-lookup").onclick=function(){tool="lookup";document.querySelectorAll(".tool").forEach(function(t){t.classList.remove("active");});this.classList.add("active");};
function setBrush(n){brush=n;[1,3,5].forEach(function(s){document.getElementById("brush-"+s).classList.toggle("active",s===n);});}
document.getElementById("brush-1").onclick=function(){setBrush(1);};
document.getElementById("brush-3").onclick=function(){setBrush(3);};
document.getElementById("brush-5").onclick=function(){setBrush(5);};
setBrush(1);

function openOv(id){document.getElementById(id).classList.add("show");}
function closeOv(id){document.getElementById(id).classList.remove("show");}
window.closeOv=closeOv;
function notify(t){const n=document.getElementById("notify");n.textContent=t;n.classList.add("show");setTimeout(function(){n.classList.remove("show");},2500);}
window.notify=notify;

document.getElementById("menu-btn").onclick=function(){document.getElementById("menu").classList.toggle("show");};

// Auth
let reg=false;
function openAuth(r){reg=r;document.getElementById("auth-title").textContent=r?"Register":"Login";document.getElementById("auth-switch").textContent=r?"Have account?":"Register";document.getElementById("auth-pass2-wrap").style.display=r?"block":"none";openOv("ov-auth");}
document.getElementById("auth-switch").onclick=function(){openAuth(!reg);};
document.getElementById("auth-go").onclick=async function(){
  const u=document.getElementById("auth-user").value.trim();
  const p=document.getElementById("auth-pass").value;
  const p2=document.getElementById("auth-pass2").value;
  if(!u||!p)return notify("Fill fields");
  if(reg&&p!==p2)return notify("Passwords do not match");
  try{
    if(reg){const fd=new FormData();fd.append("username",u);fd.append("password",p);const r=await fetch("/register",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Error");notify("Registered! Login now");openAuth(false);}
    else{const fd=new FormData();fd.append("username",u);fd.append("password",p);const r=await fetch("/token",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Login failed");token=d.access_token;localStorage.setItem("pix_token",token);user=d.user;closeOv("ov-auth");loadMe();notify("Hi @"+u);}
  }catch(e){notify(e.message);}
};

document.getElementById("btn-profile").onclick=async function(){document.getElementById("menu").classList.remove("show");await loadMe();const el=document.getElementById("profile-body");el.innerHTML=user?("<p><b>@"+user.username+"</b>"+(user.is_mod?" MOD":"")+"</p><p>Pixels: "+user.pixels_left+" / "+user.limit+"</p>"):"<p>Guest</p>";openOv("ov-profile");};
document.getElementById("btn-mod").onclick=async function(){try{await api("/mod/become",{method:"POST",json:{code:document.getElementById("mod-code").value.trim()}});notify("You are mod!");loadMe();closeOv("ov-profile");}catch(e){notify(e.message);}};
document.getElementById("btn-settings").onclick=function(){document.getElementById("menu").classList.remove("show");openOv("ov-settings");};
document.getElementById("lang").onchange=function(){localStorage.setItem("pix_lang",this.value);notify("Language: "+this.value);};
document.getElementById("lang").value=localStorage.getItem("pix_lang")||"en";

document.getElementById("btn-download").onclick=function(){document.getElementById("menu").classList.remove("show");const o=document.createElement("canvas");o.width=SIZE;o.height=SIZE;const c=o.getContext("2d");c.drawImage(bgMap,0,0,SIZE,SIZE);c.drawImage(canvas,0,0);const a=document.createElement("a");a.download="pixpaint.png";a.href=o.toDataURL("image/png");a.click();};

// Template with coords + original size
document.getElementById("btn-template").onclick=function(){document.getElementById("menu").classList.remove("show");openOv("ov-template");};
document.getElementById("tpl-file").onchange=function(e){const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=function(){tplImg=img;notify("Image loaded "+img.width+"x"+img.height);};img.src=URL.createObjectURL(f);};
document.getElementById("btn-tpl-apply").onclick=function(){
  if(!tplImg)return notify("Choose file first");
  const x=+document.getElementById("tpl-x").value||0;
  const y=+document.getElementById("tpl-y").value||0;
  let w=+document.getElementById("tpl-w").value||0;
  let h;if(w<=0){w=tplImg.width;h=tplImg.height;}else{h=Math.round(tplImg.height*(w/tplImg.width));}
  tplCtx.clearRect(0,0,SIZE,SIZE);
  tplCtx.globalAlpha=1;
  tplCtx.drawImage(tplImg,x,y,w,h);
  tplC.style.opacity=(document.getElementById("tpl-opacity").value/100).toFixed(2);
  notify("Template at "+x+","+y+" size "+w+"x"+h);
  closeOv("ov-template");
};
document.getElementById("tpl-opacity").oninput=function(){tplC.style.opacity=(this.value/100).toFixed(2);};
document.getElementById("btn-tpl-clear").onclick=function(){tplCtx.clearRect(0,0,SIZE,SIZE);tplImg=null;notify("Removed");};

// Earn
document.getElementById("btn-earn").onclick=async function(){
  if(earnCD>0)return notify("Cooldown "+earnCD+"s");
  try{
    const d=await api("/earn/start");
    const g=document.getElementById("earn-grid");g.innerHTML="";
    d.options.forEach(function(opt){const b=document.createElement("div");b.className="earn-opt";b.textContent=opt;b.onclick=function(){checkEarn(opt,d.session_id);};g.appendChild(b);});
    document.getElementById("earn-msg").textContent="";openOv("ov-earn");
  }catch(e){notify(e.message);}
};
async function checkEarn(answer,sid){
  try{const d=await api("/earn/check?session_id="+sid,{method:"POST",json:{answer:answer,correct:""}});const m=document.getElementById("earn-msg");
  if(d.ok){m.textContent="+"+d.added;m.style.color="var(--green)";earnCD=d.next_cooldown||7;loadMe();setTimeout(function(){closeOv("ov-earn");},900);}
  else{m.textContent="Wrong";m.style.color="var(--danger)";earnCD=d.next_cooldown||5;}
  const t=setInterval(function(){if(--earnCD<=0)clearInterval(t);},1000);
  }catch(e){notify(e.message);}
}

// Clans
document.getElementById("btn-clans").onclick=async function(){
  document.getElementById("menu").classList.remove("show");
  try{const list=await api("/clans");const el=document.getElementById("clans-body");el.innerHTML=list.length?list.map(function(c){return "<div class=clan-item><div><b>"+c.name+"</b><br><small>"+c.members_count+"/20</small></div><button onclick=\"joinClan('"+c.id+"')\">Join</button></div>";}).join(""):"<p>No clans</p>";}catch(e){document.getElementById("clans-body").innerHTML="<p>Error</p>";}
  openOv("ov-clans");
};
window.joinClan=async function(id){try{await api("/clan/join",{method:"POST",json:{clan_id:id}});notify("Joined");loadMe();closeOv("ov-clans");}catch(e){notify(e.message);}};
document.getElementById("btn-clan-create").onclick=async function(){const n=document.getElementById("clan-name").value.trim();if(!n)return;try{await api("/clan/create",{method:"POST",json:{name:n}});notify("Created");loadMe();closeOv("ov-clans");}catch(e){notify(e.message);}};

document.getElementById("btn-clear-mod").onclick=function(){document.getElementById("menu").classList.remove("show");openOv("ov-clear");};
document.getElementById("btn-do-clear").onclick=async function(){try{const body={x1:+cx1.value,y1:+cy1.value,x2:+cx2.value,y2:+cy2.value,full:cfull.checked};const r=await api("/mod/clear_water",{method:"POST",json:body});notify(r.msg||("Deleted "+(r.deleted||0)));closeOv("ov-clear");}catch(e){notify(e.message);}};

// Load pixels - several chunks
async function loadAll(){
  const step=512;
  for(let y=0;y<SIZE;y+=step){
    for(let x=0;x<SIZE;x+=step){
      try{
        const chunk=await api("/canvas/chunk?x1="+x+"&y1="+y+"&x2="+(x+step)+"&y2="+(y+step));
        chunk.forEach(function(p){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,1,1);});
      }catch(e){return;} // stop if backend fails
    }
  }
}

centerView();connectWS();loadMe();
// load center area first then rest
(async function(){
  try{const chunk=await api("/canvas/chunk?x1=0&y1=0&x2=1024&y2=1024");chunk.forEach(function(p){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,1,1);});}catch(e){}
  loadAll();
})();
window.addEventListener("resize",centerView);
bgMap.onerror=function(){bgMap.style.display="none";};
})();
